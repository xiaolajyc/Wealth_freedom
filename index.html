<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fc"><title>财富自由 · V2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#eef2ff,#f7f8fc 45%);color:#172033;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100vh}.app{width:min(560px,100%);margin:auto;padding:28px 18px 40px}header{text-align:center;margin:8px 0 25px}.logo{width:50px;height:50px;border-radius:16px;background:#172033;color:#fff;display:grid;place-items:center;margin:0 auto 13px;font-size:23px;box-shadow:0 8px 20px #17203322}h1{margin:0;font-size:27px;letter-spacing:-.7px}.sub{margin-top:6px;color:#7a8496;font-size:13px}.card{background:#ffffffe8;border:1px solid #fff;border-radius:21px;padding:18px;margin-bottom:14px;box-shadow:0 12px 35px #1f293d12;backdrop-filter:blur(14px)}.title{font-size:14px;font-weight:750;margin:0 0 13px}label{display:block;color:#7a8496;font-size:12px;margin-bottom:6px}input{width:100%;height:48px;border:1px solid #e4e8ef;border-radius:13px;background:#fff;padding:0 14px;font-size:17px;outline:none}input:focus{border-color:#9db1ff;box-shadow:0 0 0 4px #315efb12}.ma{display:grid;grid-template-columns:1fr 1fr;gap:9px}.ma button{height:48px;border:1px solid #e4e8ef;background:#fff;color:#596477;border-radius:13px;font-weight:650}.ma button.active{border-color:#a8b9ff;background:#eef2ff;color:#315efb}.result{position:relative;overflow:hidden}.head{display:flex;justify-content:space-between;align-items:center}.asset{font-size:15px;font-weight:750}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#eef2ff;color:#315efb;font-weight:700}.green{background:#e9f8f2;color:#119669}.red{background:#fff0f2;color:#d54b5b}.state{font-size:13px;color:#7a8496;margin:10px 0 7px}.amount{font-size:40px;font-weight:800;letter-spacing:-1.5px;margin:0}.rule{font-size:12px;color:#8a93a3;margin-top:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:9px;margin-top:12px}button.save{flex:1;height:44px;border:0;border-radius:12px;background:#172033;color:#fff;font-weight:700}button.reset{height:44px;border:0;border-radius:12px;background:#edf0f5;color:#172033;padding:0 14px;font-weight:700}.foot{text-align:center;color:#9aa2b1;font-size:11px;margin-top:18px}@media(max-width:380px){.app{padding:22px 13px}.amount{font-size:34px}}
</style></head><body><main class="app">
<header><div class="logo">↗</div><h1>财富自由</h1><div class="sub">Smart Investment · 每月定投计算器</div></header>
<section class="card"><h2 class="title">本月纳斯达克 5年 PE</h2><input id="pe" type="number" inputmode="decimal" step="0.01" placeholder="例如 38.5"></section>
<section class="card"><h2 class="title">TQQQ · MA200</h2><div class="ma"><button id="above" class="active" onclick="setMA('above')">高于 MA200</button><button id="below" onclick="setMA('below')">低于 MA200</button></div></section>
<section class="card result"><div class="head"><div class="asset">🇨🇳 国内 QQQ</div><div id="qb" class="badge">等待 PE</div></div><div id="qs" class="state">输入 PE 后自动计算</div><div id="qa" class="amount">—</div><div id="qr" class="rule">策略金额</div></section>
<section class="card result"><div class="head"><div class="asset">🇺🇸 国外 TQQQ</div><div id="tb" class="badge">等待输入</div></div><div id="ts" class="state">PE + MA200 自动计算</div><div id="ta" class="amount">—</div><div id="tr" class="rule">策略金额</div></section>
<section class="card"><h2 class="title">我的基准金额</h2><div class="row"><div><label>🇨🇳 QQQ · 1份</label><input id="qbv" type="number" inputmode="decimal" step="1"></div><div><label>🇺🇸 TQQQ · 1份</label><input id="tbv" type="number" inputmode="decimal" step="1"></div></div><div class="actions"><button class="save" onclick="saveBase()">保存基准金额</button><button class="reset" onclick="resetBase()">默认</button></div></section>
<div class="foot">V2 · 基准金额自动保存在本设备</div></main>
<script>
const K='wealthFreedomSimpleV2',D={qqq:2000,tqqq:500,ma:'above'};let s=JSON.parse(localStorage.getItem(K)||'null')||D;
const $=x=>document.getElementById(x),fmt=(n,c)=>(c==='CNY'?'¥':'$')+Number(n).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});
function save(){localStorage.setItem(K,JSON.stringify(s))}
function setMA(v){s.ma=v;save();load();calc()}
function load(){$('qbv').value=s.qqq;$('tbv').value=s.tqqq;$('above').classList.toggle('active',s.ma==='above');$('below').classList.toggle('active',s.ma==='below')}
function saveBase(){let a=+$('qbv').value,b=+$('tbv').value;if(a<=0||b<=0)return alert('请输入有效的基准金额');s.qqq=a;s.tqqq=b;save();calc()}
function resetBase(){s={...D};save();load();calc()}
function q(pe){if(!Number.isFinite(pe))return null;if(pe>95)return['极热','卖出 4份',-4,'red'];if(pe>90)return['过热','卖出 2份',-2,'red'];if(pe>60)return['中间偏热','不操作',0,''];if(pe>=40)return['中间偏冷','买入 1份',1,'green'];if(pe>=20)return['冷','买入 2份',2,'green'];if(pe>=10)return['过冷','买入 4份',4,'green'];if(pe>=5)return['超冷','买入 6份',6,'green'];return['冰点','买入 8份',8,'green']}
function t(pe){if(s.ma==='below')return['MA200 以下','停止定投',0,'red'];if(!Number.isFinite(pe))return null;let m=pe>90?.8:pe>60?1:pe>=40?1.2:pe>=20?1.5:2;return['MA200 以上',m+' × 1份',m,m===1?'': 'green']}
function calc(){let pe=parseFloat($('pe').value),a=q(pe),b=t(pe);if(a){$('qb').textContent=a[0];$('qb').className='badge '+a[3];$('qs').textContent=a[1];$('qa').textContent=fmt(Math.abs(a[2])*s.qqq,'CNY');$('qr').textContent=Math.abs(a[2])+'份 × '+fmt(s.qqq,'CNY')+(a[2]<0?' · 卖出':' · 买入')}else{$('qb').textContent='等待 PE';$('qb').className='badge';$('qs').textContent='输入 PE 后自动计算';$('qa').textContent='—';$('qr').textContent='策略金额'}if(b){$('tb').textContent=b[0];$('tb').className='badge '+b[3];$('ts').textContent=b[1];$('ta').textContent=fmt(b[2]*s.tqqq,'USD');$('tr').textContent=b[2]===0?'本月不买入':b[2]+' × '+fmt(s.tqqq,'USD')+' / 份'}else{$('tb').textContent='等待输入';$('tb').className='badge';$('ts').textContent='输入 PE 后自动计算';$('ta').textContent='—';$('tr').textContent='策略金额'}}
$('pe').addEventListener('input',calc);load();calc();
</script></body></html>
